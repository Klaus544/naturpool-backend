<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Naturpool</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2d7d5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Naturpool">
<link rel="apple-touch-icon" href="/icon.svg">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js");
    });
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", system-ui, sans-serif; background: #f4f8f6; }
input, select, button, textarea { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;


const STORAGE_KEY = "naturpool_v3";
const BACKEND_URL = "https://naturpool-backend-test1.vercel.app";

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function save(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

const C = {
  bg: "#f4f8f6", card: "#ffffff", accent: "#2d7d5c",
  accentLight: "#e6f4ee", text: "#1a2e25", muted: "#7a9e8e",
  border: "#daeae1", red: "#e05252", orange: "#e0923a", green: "#27ae60",
};

const DEFAULT_REMINDERS = [
  { id: 1, title: "pH-Wert messen",         icon: "🧪", days: 3,  lastDone: null },
  { id: 2, title: "Reinigung Roboter",       icon: "🤖", days: 7,  lastDone: null },
  { id: 3, title: "Pflegemittel hinzufügen", icon: "🧴", days: 14, lastDone: null },
  { id: 4, title: "Filter kontrollieren",    icon: "🔧", days: 14, lastDone: null },
  { id: 5, title: "Wasserpflanzen schneiden",icon: "🌿", days: 30, lastDone: null },
];

function phColor(v) {
  if (v < 6.5) return C.red;
  if (v < 7.0) return C.orange;
  if (v <= 7.8) return C.green;
  if (v <= 8.5) return C.orange;
  return C.red;
}
function phLabel(v) {
  if (v < 6.5) return "Zu sauer";
  if (v < 7.0) return "Leicht sauer";
  if (v <= 7.8) return "Optimal";
  if (v <= 8.5) return "Leicht basisch";
  return "Zu basisch";
}
function fmt(iso) {
  return new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function fmtShort(iso) {
  return new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

const inputStyle = {
  width: "100%", boxSizing: "border-box", padding: "11px 13px",
  borderRadius: 10, border: `1.5px solid ${C.border}`, fontSize: 15,
  outline: "none", background: "#fff", color: C.text,
};

const typeConfig = {
  ph:        { label: "pH-Wert",   icon: "🧪", color: C.accent },
  mittel:    { label: "Mittel",    icon: "🧴", color: "#8e44ad" },
  reinigung: { label: "Reinigung", icon: "🤖", color: "#2980b9" },
};

const SecLabel = ({ children }) => (
  <div style={{ fontSize: 11, color: "#7a9e8e", textTransform: "uppercase", letterSpacing: "1px", marginBottom: 10 }}>{children}</div>
);

const Card = ({ children, style = {} }) => (
  <div style={{ background: "#ffffff", borderRadius: 14, padding: "16px", marginBottom: 12, border: "1px solid #daeae1", boxShadow: "0 1px 4px rgba(0,0,0,0.05)", ...style }}>{children}</div>
);

const Btn = ({ label, onClick, style = {} }) => (
  <button onClick={onClick} style={{ background: "#2d7d5c", color: "#fff", border: "none", borderRadius: 10, padding: "11px 18px", fontWeight: 600, fontSize: 14, cursor: "pointer", ...style }}>{label}</button>
);

function App() {
  const [tab, setTab] = useState("log");
  const [entries, setEntries] = useState([]);
  const [reminders, setReminders] = useState(DEFAULT_REMINDERS);
  const [showForm, setShowForm] = useState(false);
  const [showRemForm, setShowRemForm] = useState(false);

  const [logType, setLogType] = useState("ph");
  const [logDate, setLogDate] = useState(() => new Date().toISOString().slice(0, 16));
  const [logPh, setLogPh] = useState("7.2");
  const [logMittel, setLogMittel] = useState("");
  const [logMenge, setLogMenge] = useState("");
  const [logEinheit, setLogEinheit] = useState("g");
  const [logNote, setLogNote] = useState("");
  const [calcDosage, setCalcDosage] = useState("");
  const [calcVolume, setCalcVolume] = useState("");
  const [showCalc, setShowCalc] = useState(false);

  // pH Scan
  const [showScan, setShowScan] = useState(false);
  const [scanLoading, setScanLoading] = useState(false);
  const [scanResult, setScanResult] = useState(null);
  const [scanError, setScanError] = useState("");

  const [remTitle, setRemTitle] = useState("");
  const [remIcon, setRemIcon] = useState("🔔");
  const [remMode, setRemMode] = useState("both");
  const [remDate, setRemDate] = useState(() => new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10));
  const [remDays, setRemDays] = useState("7");

  // Shopping list
  const [shopItems, setShopItems] = useState([]);
  const [shopName, setShopName] = useState("");
  const [shopMenge, setShopMenge] = useState("");
  const [shopEinheit, setShopEinheit] = useState("g");
  const [shopNote, setShopNote] = useState("");



  useEffect(() => {
    const d = load();
    if (d.entries) setEntries(d.entries);
    if (d.reminders) setReminders(d.reminders);
    if (d.shopItems) setShopItems(d.shopItems);
  }, []);

  useEffect(() => { save({ entries, reminders, shopItems }); }, [entries, reminders, shopItems]);

  async function analyzePhImage(file) {
    setScanLoading(true);
    setScanResult(null);
    setScanError("");
    try {
      const base64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(",")[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      const mediaType = file.type || "image/jpeg";
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: `Du bist ein Experte für Poolwasser-Teststreifen. Analysiere das Bild des Teststreifens und schätze den pH-Wert anhand der Farbe des pH-Feldes.
Die Farbskala ist: Orange = pH 6.8, Orange-Rot = pH 7.2, Rot = pH 7.6, Dunkelrot = pH 8.0, Pink/Lila = pH 8.4.
Antworte NUR mit einem JSON-Objekt in diesem Format (kein anderer Text):
{"ph": 7.2, "confidence": "hoch", "farbe": "orange-rot", "hinweis": "Kurzer Hinweis auf deutsch"}`,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
              { type: "text", text: "Analysiere den pH-Wert auf diesem Teststreifen." }
            ]
          }]
        })
      });
      const data = await response.json();
      const text = data.content?.filter(b => b.type === "text").map(b => b.text).join("") || "";
      const clean = text.replace(/```json|```/g, "").trim();
      const result = JSON.parse(clean);
      setScanResult(result);
      setLogPh(String(result.ph));
      setLogType("ph");
    } catch(e) {
      setScanError("Analyse fehlgeschlagen: " + e.message);
    }
    setScanLoading(false);
  }

  function addEntry() {
    const entry = {
      id: Date.now(), type: logType, note: logNote,
      date: logDate ? new Date(logDate).toISOString() : new Date().toISOString(),
      ...(logType === "ph" && { ph: parseFloat(logPh) }),
      ...(logType === "mittel" && { mittel: logMittel, menge: logMenge, einheit: logEinheit }),
    };
    setEntries(prev => [entry, ...prev]);
    setLogNote(""); setLogPh("7.2"); setLogMittel(""); setLogMenge("");
    setLogDate(new Date().toISOString().slice(0, 16));
    setShowForm(false);
  }

  function addReminder() {
    if (!remTitle.trim()) return;
    setReminders(prev => [...prev, {
      id: Date.now(), title: remTitle, icon: remIcon,
      mode: remMode,
      dueDate: (remMode === "date" || remMode === "both") ? remDate : null,
      days: (remMode === "interval" || remMode === "both") ? (parseInt(remDays) || 7) : null,
      lastDone: null,
    }]);
    setRemTitle(""); setRemDays("7"); setRemMode("both");
    setRemDate(new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10));
    setShowRemForm(false);
  }

  function markDone(id) {
    setReminders(prev => prev.map(r => r.id === id ? { ...r, lastDone: new Date().toISOString() } : r));
  }

  function isDue(r) {
    const now = Date.now();
    if (r.mode === "date" || (!r.mode && !r.days)) {
      if (!r.dueDate) return false;
      return now >= new Date(r.dueDate).getTime();
    }
    if (r.mode === "interval") {
      if (!r.lastDone) return true;
      return Math.floor((now - new Date(r.lastDone).getTime()) / 86400000) >= r.days;
    }
    // both
    const dateDue = r.dueDate ? now >= new Date(r.dueDate).getTime() : false;
    const intervalDue = r.lastDone
      ? Math.floor((now - new Date(r.lastDone).getTime()) / 86400000) >= r.days
      : true;
    return dateDue || intervalDue;
  }

  function nextDueDate(r) {
    const candidates = [];
    if ((r.mode === "date" || r.mode === "both") && r.dueDate) {
      const d = new Date(r.dueDate + "T00:00:00");
      if (d.getTime() > Date.now()) candidates.push(d);
    }
    if ((r.mode === "interval" || r.mode === "both" || (!r.mode && r.days)) && r.days) {
      const base = r.lastDone ? new Date(r.lastDone) : null;
      if (base) {
        const d = new Date(base.getTime() + r.days * 86400000);
        if (d.getTime() > Date.now()) candidates.push(d);
      }
    }
    if (candidates.length === 0) return null;
    return candidates.reduce((a, b) => a < b ? a : b);
  }

  const dueCount = reminders.filter(r => isDue(r)).length;
  const phEntries = entries.filter(e => e.type === "ph" && !isNaN(e.ph));
  const lastPh = phEntries[0];
  const avgPh = phEntries.length ? (phEntries.reduce((a, b) => a + b.ph, 0) / phEntries.length) : null;

  // ── STATS helpers ──
  const last30 = (type) => {
    const cutoff = Date.now() - 30 * 86400000;
    return entries.filter(e => e.type === type && new Date(e.date).getTime() > cutoff);
  };
  const phMin = phEntries.length ? Math.min(...phEntries.map(e => e.ph)) : null;
  const phMax = phEntries.length ? Math.max(...phEntries.map(e => e.ph)) : null;
  const optimalPct = phEntries.length
    ? Math.round(phEntries.filter(e => e.ph >= 7.0 && e.ph <= 7.8).length / phEntries.length * 100) : 0;
  const mittelEntries = entries.filter(e => e.type === "mittel");
  const reinigungEntries = entries.filter(e => e.type === "reinigung");

  // group mittel by name
  const mittelByName = mittelEntries.reduce((acc, e) => {
    const key = e.mittel || "Unbekannt";
    acc[key] = (acc[key] || 0) + 1;
    return acc;
  }, {});

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'Segoe UI', system-ui, sans-serif", color: C.text, maxWidth: 430, margin: "0 auto" }}>

      {/* Header */}
      <div style={{ background: "linear-gradient(135deg, #2d7d5c, #1a5c3f)", padding: "22px 20px 16px", color: "#fff" }}>
        <div style={{ fontSize: 21, fontWeight: 800, letterSpacing: "-0.5px" }}>🏊 Naturpool</div>
        {lastPh ? (
          <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ fontSize: 36, fontWeight: 800, color: phColor(lastPh.ph), lineHeight: 1 }}>{lastPh.ph.toFixed(1)}</div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 700, color: phColor(lastPh.ph) }}>{phLabel(lastPh.ph)}</div>
              <div style={{ fontSize: 11, opacity: 0.65, marginTop: 2 }}>Letzte Messung {fmt(lastPh.date)}</div>
            </div>
            {avgPh && (
              <div style={{ marginLeft: "auto", textAlign: "right" }}>
                <div style={{ fontSize: 11, opacity: 0.65 }}>Durchschnitt</div>
                <div style={{ fontSize: 18, fontWeight: 700 }}>{avgPh.toFixed(2)}</div>
              </div>
            )}
          </div>
        ) : (
          <div style={{ marginTop: 8, fontSize: 13, opacity: 0.65 }}>Noch keine Messungen</div>
        )}
        {dueCount > 0 && (
          <div style={{ marginTop: 10, background: "rgba(255,255,255,0.15)", borderRadius: 8, padding: "5px 12px", fontSize: 12, display: "inline-block" }}>
            ⚠️ {dueCount} Erinnerung{dueCount > 1 ? "en" : ""} fällig
          </div>
        )}
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", background: C.card, borderBottom: `1px solid ${C.border}` }}>
        {[
          { key: "log",       label: "📋 Erfassung" },
          { key: "stats",     label: "📊 Statistik" },
          { key: "reminders", label: `🔔${dueCount ? ` (${dueCount})` : ""}` },
          { key: "shop",      label: `🛒${shopItems.length ? ` (${shopItems.length})` : ""}` },
        ].map(t => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{
            flex: 1, padding: "13px 6px", border: "none",
            borderBottom: tab === t.key ? `3px solid ${C.accent}` : "3px solid transparent",
            background: "none", color: tab === t.key ? C.accent : C.muted,
            fontWeight: tab === t.key ? 700 : 500, fontSize: 12, cursor: "pointer",
          }}>{t.label}</button>
        ))}
      </div>

      <div style={{ padding: "16px" }}>

        {/* ── ERFASSUNG ── */}
        {tab === "log" && (
          <>
            {showForm ? (
              <Card>
                <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 14 }}>Eintrag erfassen</div>
                <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
                  {Object.entries(typeConfig).map(([k, v]) => (
                    <button key={k} onClick={() => setLogType(k)} style={{
                      flex: 1, padding: "9px 4px", border: `2px solid ${logType === k ? v.color : C.border}`,
                      borderRadius: 10, background: logType === k ? v.color + "18" : "#fff",
                      color: logType === k ? v.color : C.muted,
                      fontWeight: logType === k ? 700 : 500, fontSize: 12, cursor: "pointer",
                    }}>{v.icon}<br />{v.label}</button>
                  ))}
                </div>

                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>Datum & Uhrzeit</label>
                  <input type="datetime-local" value={logDate} onChange={e => setLogDate(e.target.value)} style={inputStyle} />
                </div>

                {logType === "ph" && (
                  <div style={{ marginBottom: 12 }}>
                    <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>pH-Wert</label>

                    <button onClick={() => setShowScan(s => !s)} style={{
                      width: "100%", marginBottom: 10, padding: "9px", borderRadius: 9,
                      border: `1.5px solid ${C.border}`, background: showScan ? C.accentLight : "#f9f9f9",
                      color: showScan ? C.accent : C.muted, fontWeight: 600, fontSize: 13, cursor: "pointer",
                    }}>
                      📷 {showScan ? "Scan ausblenden" : "Teststreifen scannen"}
                    </button>

                    {showScan && (
                      <div style={{ background: "#f7faf9", border: `1px solid ${C.border}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
                        <div style={{ fontSize: 12, color: C.muted, marginBottom: 10, lineHeight: 1.5 }}>
                          Foto des Teststreifens aufnehmen — die KI erkennt die Farbe und schätzt den pH-Wert.
                        </div>
                        <label style={{ display: "block", width: "100%", padding: "11px", borderRadius: 9, border: `2px dashed ${C.accent}`, background: C.accentLight, color: C.accent, fontWeight: 700, fontSize: 14, cursor: "pointer", textAlign: "center", boxSizing: "border-box" }}>
                          📷 Foto auswählen / aufnehmen
                          <input type="file" accept="image/*" capture="environment" style={{ display: "none" }}
                            onChange={e => { if (e.target.files[0]) analyzePhImage(e.target.files[0]); }} />
                        </label>
                        {scanLoading && (
                          <div style={{ textAlign: "center", padding: "16px 0", color: C.muted, fontSize: 13 }}>🔍 Analysiere Farbe…</div>
                        )}
                        {scanError && (
                          <div style={{ marginTop: 10, padding: "10px 12px", background: "#fdf0ee", borderRadius: 8, fontSize: 13, color: "#e05252" }}>{scanError}</div>
                        )}
                        {scanResult && (
                          <div style={{ marginTop: 12, background: phColor(scanResult.ph) + "18", border: `1.5px solid ${phColor(scanResult.ph)}44`, borderRadius: 10, padding: 14 }}>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                              <div>
                                <div style={{ fontSize: 11, color: C.muted, textTransform: "uppercase" }}>Erkannter pH-Wert</div>
                                <div style={{ fontSize: 32, fontWeight: 800, color: phColor(scanResult.ph), lineHeight: 1.2 }}>{scanResult.ph.toFixed(1)}</div>
                                <div style={{ fontSize: 12, color: phColor(scanResult.ph), fontWeight: 600 }}>{phLabel(scanResult.ph)}</div>
                              </div>
                              <div style={{ textAlign: "right" }}>
                                <div style={{ fontSize: 11, color: C.muted }}>Farbe: {scanResult.farbe}</div>
                                <div style={{ fontSize: 11, color: C.muted }}>Konfidenz: {scanResult.confidence}</div>
                              </div>
                            </div>
                            {scanResult.hinweis && <div style={{ fontSize: 12, color: C.muted, marginTop: 6, padding: "8px 10px", background: "rgba(255,255,255,0.6)", borderRadius: 7 }}>ℹ️ {scanResult.hinweis}</div>}
                            <div style={{ fontSize: 11, color: C.accent, marginTop: 8, fontWeight: 600 }}>✓ Wert wurde übernommen</div>
                          </div>
                        )}
                      </div>
                    )}

                    <input type="number" step="0.1" min="4" max="10" value={logPh}
                      onChange={e => setLogPh(e.target.value)}
                      style={{ ...inputStyle, fontSize: 24, fontWeight: 800, textAlign: "center", color: phColor(parseFloat(logPh) || 7) }} />
                    <div style={{ textAlign: "center", fontSize: 12, color: phColor(parseFloat(logPh) || 7), fontWeight: 600, marginTop: 4 }}>
                      {phLabel(parseFloat(logPh) || 7)}
                    </div>
                  </div>
                )}

                {logType === "mittel" && (<>
                  <div style={{ marginBottom: 12 }}>
                    <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>Mittel / Produkt</label>
                    <input type="text" placeholder="z.B. pH-Senker" value={logMittel}
                      onChange={e => setLogMittel(e.target.value)} style={inputStyle} />
                  </div>

                  {/* Rechner toggle */}
                  <button onClick={() => setShowCalc(c => !c)} style={{
                    width: "100%", marginBottom: 12, padding: "9px", borderRadius: 9,
                    border: `1.5px solid ${C.border}`, background: showCalc ? C.accentLight : "#f9f9f9",
                    color: showCalc ? C.accent : C.muted, fontWeight: 600, fontSize: 13, cursor: "pointer",
                  }}>
                    🧮 {showCalc ? "Rechner ausblenden" : "Menge berechnen (Dosierung × m³)"}
                  </button>

                  {showCalc && (() => {
                    const d = parseFloat(calcDosage);
                    const v = parseFloat(calcVolume);
                    const result = !isNaN(d) && !isNaN(v) && d > 0 && v > 0 ? d * v : null;
                    return (
                      <div style={{ background: "#f7faf9", border: `1px solid ${C.border}`, borderRadius: 10, padding: "14px", marginBottom: 12 }}>
                        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                          <div style={{ flex: 1 }}>
                            <label style={{ fontSize: 11, color: C.muted, display: "block", marginBottom: 3 }}>Dosierung pro m³</label>
                            <div style={{ display: "flex", gap: 4 }}>
                              <input type="number" min="0" step="0.1" value={calcDosage}
                                onChange={e => setCalcDosage(e.target.value)}
                                placeholder="z.B. 10" style={{ ...inputStyle, textAlign: "center", fontWeight: 700, flex: 1 }} />
                              <select value={logEinheit} onChange={e => setLogEinheit(e.target.value)}
                                style={{ ...inputStyle, width: 58, padding: "11px 6px" }}>
                                {["g","kg","ml","l","cl"].map(u => <option key={u}>{u}</option>)}
                              </select>
                            </div>
                          </div>
                          <div style={{ flex: 1 }}>
                            <label style={{ fontSize: 11, color: C.muted, display: "block", marginBottom: 3 }}>Poolvolumen (m³)</label>
                            <input type="number" min="0" step="0.5" value={calcVolume}
                              onChange={e => setCalcVolume(e.target.value)}
                              placeholder="z.B. 50" style={{ ...inputStyle, textAlign: "center", fontWeight: 700 }} />
                          </div>
                        </div>
                        {result !== null && (
                          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: C.accentLight, borderRadius: 8, padding: "10px 14px" }}>
                            <span style={{ fontSize: 13, color: C.accent }}>{calcDosage} {logEinheit}/m³ × {calcVolume} m³</span>
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <span style={{ fontSize: 20, fontWeight: 800, color: C.accent }}>{result % 1 === 0 ? result : result.toFixed(1)} {logEinheit}</span>
                              <button onClick={() => setLogMenge(String(result % 1 === 0 ? result : result.toFixed(1)))}
                                style={{ background: C.accent, color: "#fff", border: "none", borderRadius: 7, padding: "5px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                                ↑ Übernehmen
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                    <div style={{ flex: 2 }}>
                      <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>Menge</label>
                      <input type="number" min="0" step="0.1" value={logMenge} onChange={e => setLogMenge(e.target.value)}
                        placeholder="z.B. 200" style={{ ...inputStyle, textAlign: "center", fontWeight: 700 }} />
                    </div>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>Einheit</label>
                      <select value={logEinheit} onChange={e => setLogEinheit(e.target.value)} style={inputStyle}>
                        {["g","kg","ml","l","cl"].map(u => <option key={u}>{u}</option>)}
                      </select>
                    </div>
                  </div>
                </>)}

                <div style={{ marginBottom: 16 }}>
                  <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>Notiz (optional)</label>
                  <input type="text" placeholder="z.B. nach Regen" value={logNote}
                    onChange={e => setLogNote(e.target.value)} style={inputStyle} />
                </div>

                <div style={{ display: "flex", gap: 8 }}>
                  <Btn label="Speichern" onClick={addEntry} />
                  <Btn label="Abbrechen" onClick={() => setShowForm(false)} style={{ background: C.accentLight, color: C.accent }} />
                </div>
              </Card>
            ) : (
              <button onClick={() => setShowForm(true)} style={{
                width: "100%", padding: "14px", borderRadius: 12,
                border: `2px dashed ${C.accent}`, background: C.accentLight,
                color: C.accent, fontWeight: 700, fontSize: 15, cursor: "pointer", marginBottom: 12,
              }}>+ Eintrag erfassen</button>
            )}

            {entries.length === 0 ? (
              <div style={{ textAlign: "center", color: C.muted, padding: "40px 0" }}>
                <div style={{ fontSize: 36, marginBottom: 8 }}>📋</div>
                <div>Noch keine Einträge.</div>
              </div>
            ) : entries.map(e => {
              const tc = typeConfig[e.type];
              return (
                <div key={e.id} style={{
                  background: C.card, borderRadius: 12, padding: "13px 15px", marginBottom: 10,
                  border: `1px solid ${C.border}`, borderLeft: `4px solid ${tc.color}`,
                  display: "flex", alignItems: "flex-start", gap: 11,
                }}>
                  <div style={{ fontSize: 20, marginTop: 2 }}>{tc.icon}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ fontSize: 11, fontWeight: 700, color: tc.color, textTransform: "uppercase", letterSpacing: "0.5px" }}>{tc.label}</span>
                      <span style={{ fontSize: 11, color: C.muted }}>{fmt(e.date)} · {fmtTime(e.date)}</span>
                    </div>
                    {e.type === "ph" && (
                      <div style={{ fontSize: 22, fontWeight: 800, color: phColor(e.ph), marginTop: 2 }}>
                        {e.ph.toFixed(1)} <span style={{ fontSize: 13, fontWeight: 600 }}>{phLabel(e.ph)}</span>
                      </div>
                    )}
                    {e.type === "mittel" && (
                      <div style={{ fontSize: 15, fontWeight: 700, marginTop: 3 }}>
                        {e.mittel} {e.menge && <span style={{ color: C.muted, fontWeight: 500 }}>· {e.menge} {e.einheit}</span>}
                      </div>
                    )}
                    {e.type === "reinigung" && (
                      <div style={{ fontSize: 14, fontWeight: 600, marginTop: 3, color: "#2980b9" }}>Reinigung durchgeführt</div>
                    )}
                    {e.note && <div style={{ fontSize: 12, color: C.muted, marginTop: 3 }}>{e.note}</div>}
                  </div>
                  <button onClick={() => setEntries(prev => prev.filter(x => x.id !== e.id))}
                    style={{ background: "none", border: "none", color: "#ccc", cursor: "pointer", fontSize: 15, padding: 0, flexShrink: 0 }}>✕</button>
                </div>
              );
            })}
          </>
        )}

        {/* ── STATISTIK ── */}
        {tab === "stats" && (
          <>
            {/* pH Übersicht */}
            <Card>
              <SecLabel>pH-Verlauf</SecLabel>
              {phEntries.length === 0 ? (
                <div style={{ color: C.muted, fontSize: 13, padding: "8px 0" }}>Noch keine pH-Messungen.</div>
              ) : (<>
                {/* Kennzahlen */}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 16 }}>
                  {[
                    { label: "Aktuell",      value: phEntries[0].ph.toFixed(1), color: phColor(phEntries[0].ph) },
                    { label: "Durchschnitt", value: avgPh.toFixed(2),           color: phColor(avgPh) },
                    { label: "Min / Max",    value: `${phMin?.toFixed(1)} / ${phMax?.toFixed(1)}`, color: C.muted },
                  ].map(s => (
                    <div key={s.label} style={{ background: C.bg, borderRadius: 10, padding: "10px 8px", textAlign: "center" }}>
                      <div style={{ fontSize: 18, fontWeight: 800, color: s.color }}>{s.value}</div>
                      <div style={{ fontSize: 10, color: C.muted, marginTop: 2, textTransform: "uppercase" }}>{s.label}</div>
                    </div>
                  ))}
                </div>

                {/* Optimal-Balken */}
                <div style={{ marginBottom: 16 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 5 }}>
                    <span>Im optimalen Bereich (7.0 – 7.8)</span>
                    <span style={{ fontWeight: 700, color: optimalPct >= 70 ? C.green : C.orange }}>{optimalPct}%</span>
                  </div>
                  <div style={{ height: 7, background: C.border, borderRadius: 4 }}>
                    <div style={{ height: "100%", width: `${optimalPct}%`, background: optimalPct >= 70 ? C.green : C.orange, borderRadius: 4, transition: "width 0.4s" }} />
                  </div>
                </div>

                {/* Liniendiagramm */}
                {phEntries.length > 1 && (() => {
                  const pts = [...phEntries].reverse().slice(-20);
                  const W = 360, H = 90, PAD = 6;
                  const minV = 6.0, maxV = 9.0;
                  const x = (i) => PAD + (i / (pts.length - 1)) * (W - PAD * 2);
                  const y = (v) => PAD + ((maxV - v) / (maxV - minV)) * (H - PAD * 2);
                  const optY1 = y(7.8), optY2 = y(7.0);
                  return (
                    <div style={{ overflowX: "auto" }}>
                      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: H }}>
                        {/* optimal zone */}
                        <rect x={0} y={optY1} width={W} height={optY2 - optY1} fill="#27ae6015" />
                        <line x1={0} y1={optY1} x2={W} y2={optY1} stroke="#27ae6040" strokeDasharray="3 3" />
                        <line x1={0} y1={optY2} x2={W} y2={optY2} stroke="#27ae6040" strokeDasharray="3 3" />
                        {/* line */}
                        {pts.map((e, i) => {
                          if (i === 0) return null;
                          const p = pts[i - 1];
                          return <line key={i} x1={x(i-1)} y1={y(p.ph)} x2={x(i)} y2={y(e.ph)} stroke={phColor(e.ph)} strokeWidth="2" strokeLinecap="round" />;
                        })}
                        {/* dots */}
                        {pts.map((e, i) => (
                          <circle key={i} cx={x(i)} cy={y(e.ph)} r="4" fill={phColor(e.ph)} />
                        ))}
                      </svg>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: C.muted, marginTop: 2 }}>
                        <span>{fmtShort(pts[0].date)}</span>
                        <span style={{ color: C.green, fontSize: 9 }}>— optimal (7.0–7.8)</span>
                        <span>{fmtShort(pts[pts.length - 1].date)}</span>
                      </div>
                    </div>
                  );
                })()}

                {/* Messungen gesamt */}
                <div style={{ marginTop: 14, fontSize: 12, color: C.muted, display: "flex", gap: 16 }}>
                  <span>📊 {phEntries.length} Messungen</span>
                  <span>📅 {last30("ph").length} in den letzten 30 Tagen</span>
                </div>
              </>)}
            </Card>

            {/* Pflegemittel */}
            <Card>
              <SecLabel>Pflegemittel</SecLabel>
              {mittelEntries.length === 0 ? (
                <div style={{ color: C.muted, fontSize: 13, padding: "8px 0" }}>Noch keine Mittel erfasst.</div>
              ) : (<>
                <div style={{ fontSize: 12, color: C.muted, marginBottom: 12 }}>
                  {mittelEntries.length} Einträge · {last30("mittel").length} in den letzten 30 Tagen
                </div>
                {/* Häufigkeit je Mittel */}
                {Object.entries(mittelByName)
                  .sort((a, b) => b[1] - a[1])
                  .map(([name, count]) => {
                    const pct = Math.round((count / mittelEntries.length) * 100);
                    return (
                      <div key={name} style={{ marginBottom: 10 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}>
                          <span style={{ fontWeight: 600 }}>🧴 {name}</span>
                          <span style={{ color: C.muted }}>{count}×</span>
                        </div>
                        <div style={{ height: 6, background: C.border, borderRadius: 3 }}>
                          <div style={{ height: "100%", width: `${pct}%`, background: "#8e44ad", borderRadius: 3 }} />
                        </div>
                      </div>
                    );
                  })}
                {/* Letzte 5 Einträge */}
                <div style={{ marginTop: 14 }}>
                  <div style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "1px", marginBottom: 8 }}>Zuletzt verwendet</div>
                  {mittelEntries.slice(0, 5).map(e => (
                    <div key={e.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${C.border}`, fontSize: 13 }}>
                      <span>{e.mittel || "–"} {e.menge && <span style={{ color: C.muted }}>· {e.menge} {e.einheit}</span>}</span>
                      <span style={{ color: C.muted, fontSize: 11 }}>{fmt(e.date)}</span>
                    </div>
                  ))}
                </div>
              </>)}
            </Card>

            {/* Reinigungen */}
            <Card>
              <SecLabel>Reinigungen</SecLabel>
              {reinigungEntries.length === 0 ? (
                <div style={{ color: C.muted, fontSize: 13, padding: "8px 0" }}>Noch keine Reinigungen erfasst.</div>
              ) : (<>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 14 }}>
                  <div style={{ background: C.bg, borderRadius: 10, padding: "10px 12px", textAlign: "center" }}>
                    <div style={{ fontSize: 22, fontWeight: 800, color: "#2980b9" }}>{reinigungEntries.length}</div>
                    <div style={{ fontSize: 10, color: C.muted, textTransform: "uppercase", marginTop: 2 }}>Gesamt</div>
                  </div>
                  <div style={{ background: C.bg, borderRadius: 10, padding: "10px 12px", textAlign: "center" }}>
                    <div style={{ fontSize: 22, fontWeight: 800, color: "#2980b9" }}>{last30("reinigung").length}</div>
                    <div style={{ fontSize: 10, color: C.muted, textTransform: "uppercase", marginTop: 2 }}>Letzte 30 Tage</div>
                  </div>
                </div>
                <div style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "1px", marginBottom: 8 }}>Letzte Reinigungen</div>
                {reinigungEntries.slice(0, 5).map(e => (
                  <div key={e.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${C.border}`, fontSize: 13 }}>
                    <span>🤖 Reinigung {e.note && <span style={{ color: C.muted }}>· {e.note}</span>}</span>
                    <span style={{ color: C.muted, fontSize: 11 }}>{fmt(e.date)}</span>
                  </div>
                ))}
              </>)}
            </Card>
          </>
        )}

        {/* ── ERINNERUNGEN ── */}
        {tab === "reminders" && (
          <>
            {showRemForm ? (
              <Card>
                <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 14 }}>Neue Erinnerung</div>

                {/* Icon */}
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 6 }}>Icon</label>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {["🔔","🧪","🤖","🧴","🔧","🌿","💧","📋"].map(ic => (
                      <button key={ic} onClick={() => setRemIcon(ic)} style={{
                        fontSize: 22, padding: "6px 10px", borderRadius: 8, cursor: "pointer",
                        border: `2px solid ${remIcon === ic ? C.accent : C.border}`,
                        background: remIcon === ic ? C.accentLight : "#fff",
                      }}>{ic}</button>
                    ))}
                  </div>
                </div>

                {/* Titel */}
                <div style={{ marginBottom: 14 }}>
                  <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>Aufgabe</label>
                  <input type="text" placeholder="z.B. Wassertest" value={remTitle}
                    onChange={e => setRemTitle(e.target.value)} style={inputStyle} />
                </div>

                {/* Modus */}
                <div style={{ marginBottom: 14 }}>
                  <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 6 }}>Planungsart</label>
                  <div style={{ display: "flex", gap: 8 }}>
                    {[
                      { key: "date",     label: "📅 Datum" },
                      { key: "interval", label: "🔁 Intervall" },
                      { key: "both",     label: "Beides" },
                    ].map(m => (
                      <button key={m.key} onClick={() => setRemMode(m.key)} style={{
                        flex: 1, padding: "8px 4px", fontSize: 12, fontWeight: remMode === m.key ? 700 : 500,
                        border: `2px solid ${remMode === m.key ? C.accent : C.border}`,
                        borderRadius: 9, background: remMode === m.key ? C.accentLight : "#fff",
                        color: remMode === m.key ? C.accent : C.muted, cursor: "pointer",
                      }}>{m.label}</button>
                    ))}
                  </div>
                </div>

                {/* Datum */}
                {(remMode === "date" || remMode === "both") && (
                  <div style={{ marginBottom: 14 }}>
                    <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>📅 Fällig am</label>
                    <input type="date" value={remDate} onChange={e => setRemDate(e.target.value)}
                      style={{ ...inputStyle, fontWeight: 600 }} />
                  </div>
                )}

                {/* Intervall */}
                {(remMode === "interval" || remMode === "both") && (
                  <div style={{ marginBottom: 14 }}>
                    <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>🔁 Wiederholen alle X Tage</label>
                    <input type="number" min="1" value={remDays} onChange={e => setRemDays(e.target.value)}
                      style={{ ...inputStyle, textAlign: "center", fontWeight: 700 }} />
                  </div>
                )}

                <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                  <Btn label="Speichern" onClick={addReminder} />
                  <Btn label="Abbrechen" onClick={() => setShowRemForm(false)} style={{ background: C.accentLight, color: C.accent }} />
                </div>
              </Card>
            ) : (
              <button onClick={() => setShowRemForm(true)} style={{
                width: "100%", padding: "14px", borderRadius: 12,
                border: `2px dashed ${C.accent}`, background: C.accentLight,
                color: C.accent, fontWeight: 700, fontSize: 15, cursor: "pointer", marginBottom: 12,
              }}>+ Erinnerung hinzufügen</button>
            )}

            {reminders.length === 0 ? (
              <div style={{ textAlign: "center", color: C.muted, padding: "40px 0" }}>
                <div style={{ fontSize: 36, marginBottom: 8 }}>🔔</div>
                <div>Keine Erinnerungen.</div>
              </div>
            ) : reminders.map(r => {
              const due = isDue(r);
              const next = nextDueDate(r);
              const daysToNext = next ? Math.ceil((next.getTime() - Date.now()) / 86400000) : null;
              return (
                <div key={r.id} style={{
                  background: C.card, borderRadius: 12, padding: "14px 15px", marginBottom: 10,
                  border: `1px solid ${C.border}`, borderLeft: `4px solid ${due ? C.red : C.green}`,
                }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1 }}>
                      <span style={{ fontSize: 22 }}>{r.icon || "🔔"}</span>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 700, fontSize: 15 }}>{r.title}</div>
                        <div style={{ fontSize: 12, marginTop: 4 }}>
                          {due
                            ? <span style={{ color: C.red, fontWeight: 600 }}>&#9888;&#65039; F&auml;llig &ndash; bitte erledigen</span>
                            : daysToNext !== null
                              ? <span style={{ color: C.accent, fontWeight: 600 }}>
                                  Nächster Termin:{" "}
                                  {next.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" })}
                                  {" "}
                                  <span style={{ color: C.muted, fontWeight: 400 }}>
                                    ({daysToNext === 1 ? "morgen" : `in ${daysToNext} Tagen`})
                                  </span>
                                </span>
                              : <span style={{ color: C.muted }}>Kein Termin geplant</span>
                          }
                        </div>
                        <div style={{ fontSize: 11, color: C.muted, marginTop: 4, display: "flex", gap: 10 }}>
                          {r.days && <span>alle {r.days} Tage</span>}
                          {r.lastDone && <span>{r.days ? "·" : ""} Zuletzt: {fmt(r.lastDone)}</span>}
                        </div>
                      </div>
                    </div>
                    <button onClick={() => setReminders(prev => prev.filter(x => x.id !== r.id))}
                      style={{ background: "none", border: "none", color: "#ccc", cursor: "pointer", fontSize: 16, paddingTop: 2 }}>✕</button>
                  </div>
                  {due && (
                    <button onClick={() => markDone(r.id)} style={{
                      marginTop: 10, width: "100%", padding: "9px", background: C.accentLight,
                      color: C.accent, border: `1px solid ${C.border}`, borderRadius: 8,
                      fontWeight: 700, fontSize: 13, cursor: "pointer",
                    }}>✓ Als erledigt markieren</button>
                  )}
                </div>
              );
            })}
          </>
        )}

        {/* ── EINKAUFSLISTE ── */}
        {tab === "shop" && (
          <>
            <Card>
              <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 14 }}>Artikel hinzufügen</div>
              <div style={{ marginBottom: 10 }}>
                <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>Produkt</label>
                <input type="text" placeholder="z.B. pH-Senker" value={shopName}
                  onChange={e => setShopName(e.target.value)} style={inputStyle} />
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                <div style={{ flex: 2 }}>
                  <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>Menge</label>
                  <input type="number" min="0" step="0.1" value={shopMenge}
                    onChange={e => setShopMenge(e.target.value)}
                    placeholder="z.B. 500" style={{ ...inputStyle, textAlign: "center", fontWeight: 700 }} />
                </div>
                <div style={{ flex: 1 }}>
                  <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>Einheit</label>
                  <select value={shopEinheit} onChange={e => setShopEinheit(e.target.value)} style={inputStyle}>
                    {["g","kg","ml","l","cl","Stk"].map(u => <option key={u}>{u}</option>)}
                  </select>
                </div>
              </div>
              <div style={{ marginBottom: 12 }}>
                <label style={{ fontSize: 12, color: C.muted, display: "block", marginBottom: 4 }}>Notiz (optional)</label>
                <input type="text" placeholder="z.B. für Sommer" value={shopNote}
                  onChange={e => setShopNote(e.target.value)} style={inputStyle} />
              </div>
              <Btn label="+ Hinzufügen" onClick={() => {
                if (!shopName.trim()) return;
                setShopItems(prev => [...prev, {
                  id: Date.now(), name: shopName,
                  menge: shopMenge, einheit: shopEinheit,
                  note: shopNote, done: false,
                }]);
                setShopName(""); setShopMenge(""); setShopNote("");
              }} style={{ width: "100%" }} />
            </Card>

            {shopItems.length === 0 ? (
              <div style={{ textAlign: "center", color: C.muted, padding: "40px 0" }}>
                <div style={{ fontSize: 36, marginBottom: 8 }}>🛒</div>
                <div>Einkaufsliste ist leer.</div>
              </div>
            ) : (
              <>
                {/* Mail-Link */}
                <button onClick={() => {
                  const lines = shopItems
                    .filter(i => !i.done)
                    .map(i => `- ${i.name}${i.menge ? " · " + i.menge + " " + i.einheit : ""}${i.note ? " (" + i.note + ")" : ""}`)
                    .join("%0A");
                  window.location.href = `mailto:?subject=Naturpool%20Einkaufsliste&body=Meine%20Einkaufsliste%3A%0A%0A${lines}`;
                }} style={{
                  width: "100%", marginBottom: 12, padding: "11px",
                  borderRadius: 10, border: `1.5px solid ${C.border}`,
                  background: "#fff", color: C.accent, fontWeight: 700,
                  fontSize: 14, cursor: "pointer", display: "flex",
                  alignItems: "center", justifyContent: "center", gap: 8,
                }}>
                  ✉️ Als E-Mail senden
                </button>

                {shopItems.map(item => (
                  <div key={item.id} style={{
                    background: C.card, borderRadius: 12, padding: "13px 15px", marginBottom: 8,
                    border: `1px solid ${C.border}`,
                    borderLeft: `4px solid ${item.done ? C.border : "#8e44ad"}`,
                    opacity: item.done ? 0.5 : 1,
                    display: "flex", alignItems: "center", gap: 12,
                  }}>
                    <button onClick={() => setShopItems(prev => prev.map(i => i.id === item.id ? { ...i, done: !i.done } : i))}
                      style={{
                        width: 24, height: 24, borderRadius: 6, flexShrink: 0,
                        border: `2px solid ${item.done ? C.green : C.border}`,
                        background: item.done ? C.green : "#fff",
                        cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                        color: "#fff", fontWeight: 700, fontSize: 13,
                      }}>{item.done ? "✓" : ""}</button>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 600, fontSize: 15, textDecoration: item.done ? "line-through" : "none" }}>
                        {item.name}
                      </div>
                      <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>
                        {item.menge && `${item.menge} ${item.einheit}`}
                        {item.note && (item.menge ? " · " : "") + item.note}
                      </div>
                    </div>
                    <button onClick={() => setShopItems(prev => prev.filter(i => i.id !== item.id))}
                      style={{ background: "none", border: "none", color: "#ccc", cursor: "pointer", fontSize: 16 }}>✕</button>
                  </div>
                ))}

                {shopItems.some(i => i.done) && (
                  <button onClick={() => setShopItems(prev => prev.filter(i => !i.done))}
                    style={{ width: "100%", marginTop: 4, padding: "10px", borderRadius: 10,
                      border: `1px solid ${C.border}`, background: "#fff",
                      color: C.muted, fontSize: 13, cursor: "pointer" }}>
                    Erledigte löschen
                  </button>
                )}
              </>
            )}
          </>
        )}

      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
