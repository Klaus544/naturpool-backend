<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Naturpool</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2d7d5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Naturpool">
<link rel="apple-touch-icon" href="/icon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", system-ui, sans-serif; background: #f4f8f6; }
input, select, button, textarea { font-family: inherit; }
</style>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  }
</script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = "naturpool_v4";
const BACKEND_URL = "https://naturpool-backend-test1.vercel.app";

function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function save(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }

const C = {
  bg:"#f4f8f6", card:"#fff", accent:"#2d7d5c", accentLight:"#e6f4ee",
  text:"#1a2e25", muted:"#7a9e8e", border:"#daeae1",
  red:"#e05252", orange:"#e0923a", green:"#27ae60"
};

const DEFAULT_REMINDERS = [
  {id:1,title:"pH-Wert messen",icon:"🧪",days:3,lastDone:null,mode:"interval"},
  {id:2,title:"Reinigung Roboter",icon:"🤖",days:7,lastDone:null,mode:"interval"},
  {id:3,title:"Pflegemittel hinzufügen",icon:"🧴",days:14,lastDone:null,mode:"interval"},
  {id:4,title:"Filter kontrollieren",icon:"🔧",days:14,lastDone:null,mode:"interval"},
  {id:5,title:"Wasserpflanzen schneiden",icon:"🌿",days:30,lastDone:null,mode:"interval"},
];

function phColor(v) {
  if(v<6.5)return C.red; if(v<7.0)return C.orange;
  if(v<=7.8)return C.green; if(v<=8.5)return C.orange; return C.red;
}
function phLabel(v) {
  if(v<6.5)return"Zu sauer"; if(v<7.0)return"Leicht sauer";
  if(v<=7.8)return"Optimal"; if(v<=8.5)return"Leicht basisch"; return"Zu basisch";
}
function fmt(iso){return new Date(iso).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});}
function fmtS(iso){return new Date(iso).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});}
function fmtT(iso){return new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}

const iS={width:"100%",padding:"11px 13px",borderRadius:10,border:`1.5px solid ${C.border}`,fontSize:15,outline:"none",background:"#fff",color:C.text};
const typeConfig={
  ph:{label:"pH-Wert",icon:"🧪",color:C.accent},
  mittel:{label:"Mittel",icon:"🧴",color:"#8e44ad"},
  reinigung:{label:"Reinigung",icon:"🤖",color:"#2980b9"}
};

function Card({children,style={}}){
  return <div style={{background:C.card,borderRadius:14,padding:16,marginBottom:12,border:`1px solid ${C.border}`,boxShadow:"0 1px 4px rgba(0,0,0,0.05)",...style}}>{children}</div>;
}
function Btn({label,onClick,style={},disabled=false}){
  return <button onClick={onClick} disabled={disabled} style={{background:disabled?C.border:C.accent,color:"#fff",border:"none",borderRadius:10,padding:"11px 18px",fontWeight:600,fontSize:14,cursor:disabled?"default":"pointer",...style}}>{label}</button>;
}

function App() {
  const [tab, setTab] = useState("log");
  const [entries, setEntries] = useState([]);
  const [reminders, setReminders] = useState(DEFAULT_REMINDERS);

  // Log form
  const [showForm, setShowForm] = useState(false);
  const [logType, setLogType] = useState("ph");
  const [logDate, setLogDate] = useState(()=>new Date().toISOString().slice(0,16));
  const [logPh, setLogPh] = useState("7.2");
  const [logMittel, setLogMittel] = useState("");
  const [logMenge, setLogMenge] = useState("");
  const [logEinheit, setLogEinheit] = useState("g");
  const [logNote, setLogNote] = useState("");
  const [calcDosage, setCalcDosage] = useState("");
  const [calcVolume, setCalcVolume] = useState("");
  const [showCalc, setShowCalc] = useState(false);
  const [showScan, setShowScan] = useState(false);
  const [scanLoading, setScanLoading] = useState(false);
  const [scanResult, setScanResult] = useState(null);
  const [scanError, setScanError] = useState("");

  // Reminder form
  const [showRemForm, setShowRemForm] = useState(false);
  const [remTitle, setRemTitle] = useState("");
  const [remIcon, setRemIcon] = useState("🔔");
  const [remMode, setRemMode] = useState("interval");
  const [remDate, setRemDate] = useState(()=>new Date(Date.now()+7*86400000).toISOString().slice(0,10));
  const [remDays, setRemDays] = useState("7");

  // Chat
  const [chatMessages, setChatMessages] = useState([
    {role:"assistant",text:"Hallo! Ich bin dein Naturpool-Assistent 🌿 Frag mich alles rund um deinen Pool — pH-Wert, Pflege, Mittel oder Probleme."}
  ]);
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const chatEndRef = useRef(null);

  useEffect(()=>{
    const d=load();
    if(d.entries)setEntries(d.entries);
    if(d.reminders)setReminders(d.reminders);
  },[]);
  useEffect(()=>{save({entries,reminders});},[entries,reminders]);
  useEffect(()=>{chatEndRef.current?.scrollIntoView({behavior:"smooth"});},[chatMessages,chatLoading]);

  const phEntries=entries.filter(e=>e.type==="ph"&&!isNaN(e.ph));
  const lastPh=phEntries[0];
  const avgPh=phEntries.length?phEntries.reduce((a,b)=>a+b.ph,0)/phEntries.length:null;
  const phMin=phEntries.length?Math.min(...phEntries.map(e=>e.ph)):null;
  const phMax=phEntries.length?Math.max(...phEntries.map(e=>e.ph)):null;
  const optPct=phEntries.length?Math.round(phEntries.filter(e=>e.ph>=7&&e.ph<=7.8).length/phEntries.length*100):0;
  const mittelE=entries.filter(e=>e.type==="mittel");
  const reinE=entries.filter(e=>e.type==="reinigung");
  const last30=t=>entries.filter(e=>e.type===t&&Date.now()-new Date(e.date).getTime()<30*86400000);
  const mittelByName=mittelE.reduce((acc,e)=>{const k=e.mittel||"?";acc[k]=(acc[k]||0)+1;return acc;},{});

  function isDue(r){
    const now=Date.now();
    if(r.mode==="date")return r.dueDate?now>=new Date(r.dueDate).getTime():false;
    if(r.mode==="interval")return r.lastDone?Math.floor((now-new Date(r.lastDone).getTime())/86400000)>=(r.days||0):true;
    const dd=r.dueDate?now>=new Date(r.dueDate).getTime():false;
    const id=r.lastDone?Math.floor((now-new Date(r.lastDone).getTime())/86400000)>=(r.days||0):true;
    return dd||id;
  }
  function nextDue(r){
    const cands=[];
    if((r.mode==="date"||r.mode==="both")&&r.dueDate){const d=new Date(r.dueDate+"T00:00:00");if(d>Date.now())cands.push(d);}
    if((r.mode==="interval"||r.mode==="both"||!r.mode)&&r.days&&r.lastDone){const d=new Date(new Date(r.lastDone).getTime()+r.days*86400000);if(d>Date.now())cands.push(d);}
    return cands.length?cands.reduce((a,b)=>a<b?a:b):null;
  }
  const dueCount=reminders.filter(r=>isDue(r)).length;

  async function analyzePhImage(file){
    setScanLoading(true);setScanResult(null);setScanError("");
    try{
      const base64=await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result.split(",")[1]);
        r.onerror=rej;
        r.readAsDataURL(file);
      });
      const response=await fetch(`${BACKEND_URL}/api/chat`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system:`Du bist ein Experte für Poolwasser-Teststreifen. Analysiere das Bild und schätze den pH-Wert anhand der Farbe. Farbskala: Orange=6.8, Orange-Rot=7.2, Rot=7.6, Dunkelrot=8.0, Pink/Lila=8.4. Antworte NUR mit JSON ohne Backticks: {"ph":7.2,"confidence":"hoch","farbe":"orange-rot","hinweis":"Kurzer Hinweis"}`,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:base64}},
            {type:"text",text:"Analysiere den pH-Wert auf diesem Teststreifen."}
          ]}]
        })
      });
      const data=await response.json();
      const text=data.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"";
      const result=JSON.parse(text.replace(/```json|```/g,"").trim());
      setScanResult(result);
      setLogPh(String(result.ph));
    }catch(e){setScanError("Analyse fehlgeschlagen: "+e.message);}
    setScanLoading(false);
  }

  function addEntry(){
    const e={id:Date.now(),type:logType,note:logNote,
      date:logDate?new Date(logDate).toISOString():new Date().toISOString(),
      ...(logType==="ph"&&{ph:parseFloat(logPh)}),
      ...(logType==="mittel"&&{mittel:logMittel,menge:logMenge,einheit:logEinheit})};
    setEntries(prev=>[e,...prev]);
    setLogNote("");setLogPh("7.2");setLogMittel("");setLogMenge("");
    setLogDate(new Date().toISOString().slice(0,16));
    setScanResult(null);setShowScan(false);setShowForm(false);
  }

  function addReminder(){
    if(!remTitle.trim())return;
    setReminders(prev=>[...prev,{id:Date.now(),title:remTitle,icon:remIcon,mode:remMode,
      dueDate:(remMode==="date"||remMode==="both")?remDate:null,
      days:(remMode==="interval"||remMode==="both")?(parseInt(remDays)||7):null,lastDone:null}]);
    setRemTitle("");setRemDays("7");setRemMode("interval");setShowRemForm(false);
  }

  async function sendChat(){
    const text=chatInput.trim();
    if(!text||chatLoading)return;
    const history=[...chatMessages,{role:"user",text}];
    setChatMessages(history);setChatInput("");setChatLoading(true);
    const phInfo=phEntries.length?`Letzter pH: ${phEntries[0].ph.toFixed(1)}, Ø: ${avgPh.toFixed(2)}`:"Keine pH-Daten";
    try{
      const res=await fetch(`${BACKEND_URL}/api/chat`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system:`Du bist ein freundlicher Naturpool-Experte. Antworte auf Deutsch, kurz und praktisch. Pool: ${phInfo}. Max 100 Woerter.`,
          messages:history.map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.text}))
        })
      });
      const text=await res.text();
      let reply="Keine Antwort.";
      try{
        const data=JSON.parse(text);
        if(data.content&&Array.isArray(data.content)){
          reply=data.content.filter(b=>b.type==="text").map(b=>b.text).join("")||reply;
        } else if(data.error){
          reply="Fehler vom Server: "+JSON.stringify(data.error);
        }
      }catch(pe){
        reply="Parse-Fehler: "+text.slice(0,100);
      }
      setChatMessages(prev=>[...prev,{role:"assistant",text:reply}]);
    }catch(e){
      setChatMessages(prev=>[...prev,{role:"assistant",text:"Verbindungsfehler: "+e.message}]);
    }
    setChatLoading(false);
  }

  return(
    <div style={{minHeight:"100vh",background:C.bg,maxWidth:430,margin:"0 auto"}}>

      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#2d7d5c,#1a5c3f)",padding:"22px 20px 16px",color:"#fff"}}>
        <div style={{fontSize:21,fontWeight:800}}>🏊 Naturpool</div>
        {lastPh?(
          <div style={{marginTop:10,display:"flex",alignItems:"center",gap:12}}>
            <div style={{fontSize:36,fontWeight:800,color:phColor(lastPh.ph),lineHeight:1}}>{lastPh.ph.toFixed(1)}</div>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:phColor(lastPh.ph)}}>{phLabel(lastPh.ph)}</div>
              <div style={{fontSize:11,opacity:.65,marginTop:2}}>Letzte Messung {fmt(lastPh.date)}</div>
            </div>
            {avgPh&&<div style={{marginLeft:"auto",textAlign:"right"}}>
              <div style={{fontSize:11,opacity:.65}}>Durchschnitt</div>
              <div style={{fontSize:18,fontWeight:700}}>{avgPh.toFixed(2)}</div>
            </div>}
          </div>
        ):<div style={{marginTop:8,fontSize:13,opacity:.65}}>Noch keine Messungen</div>}
        {dueCount>0&&<div style={{marginTop:10,background:"rgba(255,255,255,0.15)",borderRadius:8,padding:"5px 12px",fontSize:12,display:"inline-block"}}>⚠️ {dueCount} Erinnerung{dueCount>1?"en":""} fällig</div>}
      </div>

      {/* Tabs */}
      <div style={{display:"flex",background:C.card,borderBottom:`1px solid ${C.border}`}}>
        {[{k:"log",l:"📋"},{k:"stats",l:"📊"},{k:"reminders",l:`🔔${dueCount?` (${dueCount})`:""}`},{k:"chat",l:"💬 KI"}].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} style={{flex:1,padding:"13px 4px",border:"none",borderBottom:tab===t.k?`3px solid ${C.accent}`:"3px solid transparent",background:"none",color:tab===t.k?C.accent:C.muted,fontWeight:tab===t.k?700:500,fontSize:12,cursor:"pointer"}}>
            {t.l}
          </button>
        ))}
      </div>

      <div style={{padding:16}}>

        {/* ERFASSUNG */}
        {tab==="log"&&(<>
          {showForm?(
            <Card>
              <div style={{fontWeight:700,fontSize:16,marginBottom:14}}>Eintrag erfassen</div>
              <div style={{display:"flex",gap:8,marginBottom:16}}>
                {Object.entries(typeConfig).map(([k,v])=>(
                  <button key={k} onClick={()=>setLogType(k)} style={{flex:1,padding:"9px 4px",border:`2px solid ${logType===k?v.color:C.border}`,borderRadius:10,background:logType===k?v.color+"18":"#fff",color:logType===k?v.color:C.muted,fontWeight:logType===k?700:500,fontSize:12,cursor:"pointer"}}>
                    {v.icon}<br/>{v.label}
                  </button>
                ))}
              </div>

              <div style={{marginBottom:12}}>
                <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Datum & Uhrzeit</label>
                <input type="datetime-local" value={logDate} onChange={e=>setLogDate(e.target.value)} style={iS}/>
              </div>

              {logType==="ph"&&(
                <div style={{marginBottom:12}}>
                  <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>pH-Wert</label>
                  <button onClick={()=>setShowScan(s=>!s)} style={{width:"100%",marginBottom:10,padding:"9px",borderRadius:9,border:`1.5px solid ${C.border}`,background:showScan?C.accentLight:"#f9f9f9",color:showScan?C.accent:C.muted,fontWeight:600,fontSize:13,cursor:"pointer"}}>
                    📷 {showScan?"Scan ausblenden":"Teststreifen scannen"}
                  </button>
                  {showScan&&(
                    <div style={{background:"#f7faf9",border:`1px solid ${C.border}`,borderRadius:10,padding:14,marginBottom:12}}>
                      <div style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.5}}>Foto des Teststreifens aufnehmen — die KI erkennt die Farbe und schätzt den pH-Wert.</div>
                      <div style={{display:"flex",gap:8,marginBottom:10}}>
                        <label style={{flex:1,padding:"10px",borderRadius:9,border:`2px dashed ${C.accent}`,background:C.accentLight,color:C.accent,fontWeight:700,fontSize:13,cursor:"pointer",textAlign:"center",display:"block"}}>
                          📷 Kamera
                          <input type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>{if(e.target.files[0])analyzePhImage(e.target.files[0]);}}/>
                        </label>
                        <label style={{flex:1,padding:"10px",borderRadius:9,border:`2px dashed ${C.accent}`,background:C.accentLight,color:C.accent,fontWeight:700,fontSize:13,cursor:"pointer",textAlign:"center",display:"block"}}>
                          🖼️ Galerie
                          <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{if(e.target.files[0])analyzePhImage(e.target.files[0]);}}/>
                        </label>
                      </div>
                      {scanLoading&&<div style={{textAlign:"center",padding:"12px 0",color:C.muted,fontSize:13}}>🔍 Analysiere Farbe…</div>}
                      {scanError&&<div style={{padding:"10px 12px",background:"#fdf0ee",borderRadius:8,fontSize:13,color:C.red}}>{scanError}</div>}
                      {scanResult&&(
                        <div style={{background:phColor(scanResult.ph)+"18",border:`1.5px solid ${phColor(scanResult.ph)}44`,borderRadius:10,padding:14}}>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                            <div>
                              <div style={{fontSize:11,color:C.muted,textTransform:"uppercase"}}>Erkannter pH-Wert</div>
                              <div style={{fontSize:32,fontWeight:800,color:phColor(scanResult.ph),lineHeight:1.2}}>{scanResult.ph.toFixed(1)}</div>
                              <div style={{fontSize:12,color:phColor(scanResult.ph),fontWeight:600}}>{phLabel(scanResult.ph)}</div>
                            </div>
                            <div style={{textAlign:"right",fontSize:12,color:C.muted}}>
                              <div>Farbe: {scanResult.farbe}</div>
                              <div>Konfidenz: {scanResult.confidence}</div>
                            </div>
                          </div>
                          {scanResult.hinweis&&<div style={{fontSize:12,color:C.muted,padding:"8px 10px",background:"rgba(255,255,255,0.6)",borderRadius:7}}>ℹ️ {scanResult.hinweis}</div>}
                          <div style={{fontSize:11,color:C.accent,marginTop:8,fontWeight:600}}>✓ Wert wurde übernommen</div>
                        </div>
                      )}
                    </div>
                  )}
                  <input type="number" step="0.1" min="4" max="10" value={logPh} onChange={e=>setLogPh(e.target.value)} style={{...iS,fontSize:24,fontWeight:800,textAlign:"center",color:phColor(parseFloat(logPh)||7)}}/>
                  <div style={{textAlign:"center",fontSize:12,color:phColor(parseFloat(logPh)||7),fontWeight:600,marginTop:4}}>{phLabel(parseFloat(logPh)||7)}</div>
                </div>
              )}

              {logType==="mittel"&&(<>
                <div style={{marginBottom:12}}>
                  <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Mittel / Produkt</label>
                  <input type="text" placeholder="z.B. pH-Senker" value={logMittel} onChange={e=>setLogMittel(e.target.value)} style={iS}/>
                </div>
                <button onClick={()=>setShowCalc(c=>!c)} style={{width:"100%",marginBottom:12,padding:"9px",borderRadius:9,border:`1.5px solid ${C.border}`,background:showCalc?C.accentLight:"#f9f9f9",color:showCalc?C.accent:C.muted,fontWeight:600,fontSize:13,cursor:"pointer"}}>
                  🧮 {showCalc?"Rechner ausblenden":"Menge berechnen (Dosierung × m³)"}
                </button>
                {showCalc&&(()=>{
                  const d=parseFloat(calcDosage),v=parseFloat(calcVolume);
                  const result=!isNaN(d)&&!isNaN(v)&&d>0&&v>0?d*v:null;
                  return(
                    <div style={{background:"#f7faf9",border:`1px solid ${C.border}`,borderRadius:10,padding:14,marginBottom:12}}>
                      <div style={{display:"flex",gap:8,marginBottom:10}}>
                        <div style={{flex:1}}>
                          <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>Dosierung pro m³</label>
                          <div style={{display:"flex",gap:4}}>
                            <input type="number" min="0" step="0.1" value={calcDosage} onChange={e=>setCalcDosage(e.target.value)} placeholder="z.B. 10" style={{...iS,textAlign:"center",fontWeight:700,flex:1}}/>
                            <select value={logEinheit} onChange={e=>setLogEinheit(e.target.value)} style={{...iS,width:60,padding:"11px 6px"}}>
                              {["g","kg","ml","l","cl"].map(u=><option key={u}>{u}</option>)}
                            </select>
                          </div>
                        </div>
                        <div style={{flex:1}}>
                          <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>Poolvolumen (m³)</label>
                          <input type="number" min="0" step="0.5" value={calcVolume} onChange={e=>setCalcVolume(e.target.value)} placeholder="z.B. 50" style={{...iS,textAlign:"center",fontWeight:700}}/>
                        </div>
                      </div>
                      {result!==null&&(
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:C.accentLight,borderRadius:8,padding:"10px 14px"}}>
                          <span style={{fontSize:13,color:C.accent}}>{calcDosage} {logEinheit}/m³ × {calcVolume} m³</span>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <span style={{fontSize:18,fontWeight:800,color:C.accent}}>{result%1===0?result:result.toFixed(1)} {logEinheit}</span>
                            <button onClick={()=>setLogMenge(String(result%1===0?result:result.toFixed(1)))} style={{background:C.accent,color:"#fff",border:"none",borderRadius:7,padding:"5px 10px",fontSize:12,fontWeight:700,cursor:"pointer"}}>↑</button>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })()}
                <div style={{display:"flex",gap:8,marginBottom:12}}>
                  <div style={{flex:2}}>
                    <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Menge</label>
                    <input type="number" min="0" step="0.1" value={logMenge} onChange={e=>setLogMenge(e.target.value)} placeholder="z.B. 200" style={{...iS,textAlign:"center",fontWeight:700}}/>
                  </div>
                  <div style={{flex:1}}>
                    <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Einheit</label>
                    <select value={logEinheit} onChange={e=>setLogEinheit(e.target.value)} style={iS}>
                      {["g","kg","ml","l","cl"].map(u=><option key={u}>{u}</option>)}
                    </select>
                  </div>
                </div>
              </>)}

              <div style={{marginBottom:16}}>
                <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Notiz (optional)</label>
                <input type="text" placeholder="z.B. nach Regen" value={logNote} onChange={e=>setLogNote(e.target.value)} style={iS}/>
              </div>
              <div style={{display:"flex",gap:8}}>
                <Btn label="Speichern" onClick={addEntry}/>
                <Btn label="Abbrechen" onClick={()=>setShowForm(false)} style={{background:C.accentLight,color:C.accent}}/>
              </div>
            </Card>
          ):(
            <button onClick={()=>setShowForm(true)} style={{width:"100%",padding:14,borderRadius:12,border:`2px dashed ${C.accent}`,background:C.accentLight,color:C.accent,fontWeight:700,fontSize:15,cursor:"pointer",marginBottom:12}}>+ Eintrag erfassen</button>
          )}

          {entries.length===0?(
            <div style={{textAlign:"center",color:C.muted,padding:"40px 0"}}><div style={{fontSize:36,marginBottom:8}}>📋</div><div>Noch keine Einträge.</div></div>
          ):entries.map(e=>{
            const tc=typeConfig[e.type];
            return(
              <div key={e.id} style={{background:C.card,borderRadius:12,padding:"13px 15px",marginBottom:10,border:`1px solid ${C.border}`,borderLeft:`4px solid ${tc.color}`,display:"flex",alignItems:"flex-start",gap:11}}>
                <div style={{fontSize:20,marginTop:2}}>{tc.icon}</div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <span style={{fontSize:11,fontWeight:700,color:tc.color,textTransform:"uppercase"}}>{tc.label}</span>
                    <span style={{fontSize:11,color:C.muted}}>{fmt(e.date)} · {fmtT(e.date)}</span>
                  </div>
                  {e.type==="ph"&&<div style={{fontSize:22,fontWeight:800,color:phColor(e.ph),marginTop:2}}>{e.ph.toFixed(1)} <span style={{fontSize:13,fontWeight:600}}>{phLabel(e.ph)}</span></div>}
                  {e.type==="mittel"&&<div style={{fontSize:15,fontWeight:700,marginTop:3}}>{e.mittel} {e.menge&&<span style={{color:C.muted,fontWeight:500}}>· {e.menge} {e.einheit}</span>}</div>}
                  {e.type==="reinigung"&&<div style={{fontSize:14,fontWeight:600,marginTop:3,color:"#2980b9"}}>Reinigung durchgeführt</div>}
                  {e.note&&<div style={{fontSize:12,color:C.muted,marginTop:3}}>{e.note}</div>}
                </div>
                <button onClick={()=>setEntries(prev=>prev.filter(x=>x.id!==e.id))} style={{background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:15,padding:0}}>✕</button>
              </div>
            );
          })}
        </>)}

        {/* STATISTIK */}
        {tab==="stats"&&(<>
          <Card>
            <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"1px",marginBottom:10}}>pH-Verlauf</div>
            {phEntries.length===0?<div style={{color:C.muted,fontSize:13}}>Noch keine Messungen.</div>:(<>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
                {[{label:"Aktuell",value:phEntries[0].ph.toFixed(1),color:phColor(phEntries[0].ph)},{label:"Ø",value:avgPh.toFixed(2),color:phColor(avgPh)},{label:"Min/Max",value:`${phMin?.toFixed(1)}/${phMax?.toFixed(1)}`,color:C.muted}].map(s=>(
                  <div key={s.label} style={{background:C.bg,borderRadius:10,padding:"10px 8px",textAlign:"center"}}>
                    <div style={{fontSize:18,fontWeight:800,color:s.color}}>{s.value}</div>
                    <div style={{fontSize:10,color:C.muted,marginTop:2,textTransform:"uppercase"}}>{s.label}</div>
                  </div>
                ))}
              </div>
              <div style={{marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:5}}>
                  <span>Optimal (7.0–7.8)</span>
                  <span style={{fontWeight:700,color:optPct>=70?C.green:C.orange}}>{optPct}%</span>
                </div>
                <div style={{height:7,background:C.border,borderRadius:4}}>
                  <div style={{height:"100%",width:`${optPct}%`,background:optPct>=70?C.green:C.orange,borderRadius:4}}/>
                </div>
              </div>
              {phEntries.length>1&&(()=>{
                const pts=[...phEntries].reverse().slice(-20);
                const W=360,H=90,P=6,minV=6,maxV=9;
                const x=i=>P+(i/(pts.length-1))*(W-P*2);
                const y=v=>P+((maxV-v)/(maxV-minV))*(H-P*2);
                return(
                  <div>
                    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H}}>
                      <rect x={0} y={y(7.8)} width={W} height={y(7.0)-y(7.8)} fill="#27ae6015"/>
                      <line x1={0} y1={y(7.8)} x2={W} y2={y(7.8)} stroke="#27ae6040" strokeDasharray="3 3"/>
                      <line x1={0} y1={y(7.0)} x2={W} y2={y(7.0)} stroke="#27ae6040" strokeDasharray="3 3"/>
                      {pts.map((e,i)=>i===0?null:<line key={i} x1={x(i-1)} y1={y(pts[i-1].ph)} x2={x(i)} y2={y(e.ph)} stroke={phColor(e.ph)} strokeWidth="2" strokeLinecap="round"/>)}
                      {pts.map((e,i)=><circle key={i} cx={x(i)} cy={y(e.ph)} r="4" fill={phColor(e.ph)}/>)}
                    </svg>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.muted}}>
                      <span>{fmtS(pts[0].date)}</span><span style={{color:C.green,fontSize:9}}>— optimal</span><span>{fmtS(pts[pts.length-1].date)}</span>
                    </div>
                  </div>
                );
              })()}
              <div style={{marginTop:12,fontSize:12,color:C.muted}}>📊 {phEntries.length} Messungen · {last30("ph").length} in 30 Tagen</div>
            </>)}
          </Card>
          <Card>
            <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"1px",marginBottom:10}}>Pflegemittel</div>
            {mittelE.length===0?<div style={{color:C.muted,fontSize:13}}>Noch keine Mittel.</div>:(<>
              <div style={{fontSize:12,color:C.muted,marginBottom:12}}>{mittelE.length} Einträge · {last30("mittel").length} in 30 Tagen</div>
              {Object.entries(mittelByName).sort((a,b)=>b[1]-a[1]).map(([name,count])=>(
                <div key={name} style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                    <span style={{fontWeight:600}}>🧴 {name}</span><span style={{color:C.muted}}>{count}×</span>
                  </div>
                  <div style={{height:6,background:C.border,borderRadius:3}}>
                    <div style={{height:"100%",width:`${Math.round(count/mittelE.length*100)}%`,background:"#8e44ad",borderRadius:3}}/>
                  </div>
                </div>
              ))}
            </>)}
          </Card>
          <Card>
            <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"1px",marginBottom:10}}>Reinigungen</div>
            {reinE.length===0?<div style={{color:C.muted,fontSize:13}}>Noch keine Reinigungen.</div>:(<>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
                {[{l:"Gesamt",v:reinE.length},{l:"30 Tage",v:last30("reinigung").length}].map(s=>(
                  <div key={s.l} style={{background:C.bg,borderRadius:10,padding:"10px 12px",textAlign:"center"}}>
                    <div style={{fontSize:22,fontWeight:800,color:"#2980b9"}}>{s.v}</div>
                    <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",marginTop:2}}>{s.l}</div>
                  </div>
                ))}
              </div>
              {reinE.slice(0,5).map(e=>(
                <div key={e.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
                  <span>🤖 Reinigung{e.note&&<span style={{color:C.muted}}> · {e.note}</span>}</span>
                  <span style={{color:C.muted,fontSize:11}}>{fmt(e.date)}</span>
                </div>
              ))}
            </>)}
          </Card>
        </>)}

        {/* ERINNERUNGEN */}
        {tab==="reminders"&&(<>
          {showRemForm?(
            <Card>
              <div style={{fontWeight:700,fontSize:16,marginBottom:14}}>Neue Erinnerung</div>
              <div style={{marginBottom:12}}>
                <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:6}}>Icon</label>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {["🔔","🧪","🤖","🧴","🔧","🌿","💧","📋"].map(ic=>(
                    <button key={ic} onClick={()=>setRemIcon(ic)} style={{fontSize:22,padding:"6px 10px",borderRadius:8,cursor:"pointer",border:`2px solid ${remIcon===ic?C.accent:C.border}`,background:remIcon===ic?C.accentLight:"#fff"}}>{ic}</button>
                  ))}
                </div>
              </div>
              <div style={{marginBottom:14}}>
                <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Aufgabe</label>
                <input type="text" placeholder="z.B. Wassertest" value={remTitle} onChange={e=>setRemTitle(e.target.value)} style={iS}/>
              </div>
              <div style={{marginBottom:14}}>
                <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:6}}>Planungsart</label>
                <div style={{display:"flex",gap:8}}>
                  {[{k:"date",l:"📅 Datum"},{k:"interval",l:"🔁 Intervall"},{k:"both",l:"Beides"}].map(m=>(
                    <button key={m.k} onClick={()=>setRemMode(m.k)} style={{flex:1,padding:"8px 4px",fontSize:12,fontWeight:remMode===m.k?700:500,border:`2px solid ${remMode===m.k?C.accent:C.border}`,borderRadius:9,background:remMode===m.k?C.accentLight:"#fff",color:remMode===m.k?C.accent:C.muted,cursor:"pointer"}}>{m.l}</button>
                  ))}
                </div>
              </div>
              {(remMode==="date"||remMode==="both")&&(
                <div style={{marginBottom:14}}>
                  <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>📅 Fällig am</label>
                  <input type="date" value={remDate} onChange={e=>setRemDate(e.target.value)} style={{...iS,fontWeight:600}}/>
                </div>
              )}
              {(remMode==="interval"||remMode==="both")&&(
                <div style={{marginBottom:14}}>
                  <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>🔁 Alle X Tage</label>
                  <input type="number" min="1" value={remDays} onChange={e=>setRemDays(e.target.value)} style={{...iS,textAlign:"center",fontWeight:700}}/>
                </div>
              )}
              <div style={{display:"flex",gap:8}}>
                <Btn label="Speichern" onClick={addReminder}/>
                <Btn label="Abbrechen" onClick={()=>setShowRemForm(false)} style={{background:C.accentLight,color:C.accent}}/>
              </div>
            </Card>
          ):(
            <button onClick={()=>setShowRemForm(true)} style={{width:"100%",padding:14,borderRadius:12,border:`2px dashed ${C.accent}`,background:C.accentLight,color:C.accent,fontWeight:700,fontSize:15,cursor:"pointer",marginBottom:12}}>+ Erinnerung hinzufügen</button>
          )}
          {reminders.map(r=>{
            const due=isDue(r),next=nextDue(r);
            const dTN=next?Math.ceil((next.getTime()-Date.now())/86400000):null;
            return(
              <div key={r.id} style={{background:C.card,borderRadius:12,padding:"14px 15px",marginBottom:10,border:`1px solid ${C.border}`,borderLeft:`4px solid ${due?C.red:C.green}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
                    <span style={{fontSize:22}}>{r.icon||"🔔"}</span>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:15}}>{r.title}</div>
                      <div style={{fontSize:12,marginTop:4}}>
                        {due?<span style={{color:C.red,fontWeight:600}}>⚠️ Fällig – bitte erledigen</span>
                          :dTN!==null?<span style={{color:C.accent,fontWeight:600}}>Nächster Termin: {next.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})} <span style={{color:C.muted,fontWeight:400}}>({dTN===1?"morgen":`in ${dTN} Tagen`})</span></span>
                          :<span style={{color:C.muted}}>Kein Termin geplant</span>}
                      </div>
                      <div style={{fontSize:11,color:C.muted,marginTop:3}}>
                        {r.days&&<span>alle {r.days} Tage</span>}
                        {r.lastDone&&<span>{r.days?" · ":""}Zuletzt: {fmt(r.lastDone)}</span>}
                      </div>
                    </div>
                  </div>
                  <button onClick={()=>setReminders(prev=>prev.filter(x=>x.id!==r.id))} style={{background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:16}}>✕</button>
                </div>
                {due&&<button onClick={()=>setReminders(prev=>prev.map(x=>x.id===r.id?{...x,lastDone:new Date().toISOString()}:x))} style={{marginTop:10,width:"100%",padding:"9px",background:C.accentLight,color:C.accent,border:`1px solid ${C.border}`,borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer"}}>✓ Als erledigt markieren</button>}
              </div>
            );
          })}
        </>)}

        {/* KI CHAT */}
        {tab==="chat"&&(
          <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 210px)"}}>
            <div style={{flex:1,overflowY:"auto",paddingBottom:8}}>
              {chatMessages.map((m,i)=>(
                <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:10}}>
                  {m.role==="assistant"&&<div style={{width:32,height:32,borderRadius:"50%",background:C.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,marginRight:8,flexShrink:0,alignSelf:"flex-end"}}>🌿</div>}
                  <div style={{maxWidth:"78%",padding:"11px 14px",borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",background:m.role==="user"?C.accent:C.card,color:m.role==="user"?"#fff":C.text,fontSize:14,lineHeight:1.5,border:m.role==="assistant"?`1px solid ${C.border}`:"none",boxShadow:"0 1px 3px rgba(0,0,0,0.07)"}}>
                    {m.text}
                  </div>
                </div>
              ))}
              {chatLoading&&(
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <div style={{width:32,height:32,borderRadius:"50%",background:C.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🌿</div>
                  <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"18px 18px 18px 4px",padding:"14px 18px",display:"flex",gap:5,alignItems:"center"}}>
                    {[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:"50%",background:C.muted,opacity:0.5+i*0.2}}/>)}
                  </div>
                </div>
              )}
              <div ref={chatEndRef}/>
            </div>
            {chatMessages.length===1&&(
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,color:C.muted,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.5px"}}>Vorschläge</div>
                {["Was bedeutet pH 8.2?","Wie oft pH messen?","Was tun bei grünem Wasser?","Welche Mittel brauche ich?"].map(q=>(
                  <button key={q} onClick={()=>setChatInput(q)} style={{display:"block",width:"100%",textAlign:"left",padding:"9px 13px",borderRadius:10,border:`1.5px solid ${C.border}`,background:C.card,color:C.text,fontSize:13,cursor:"pointer",marginBottom:6}}>{q}</button>
                ))}
              </div>
            )}
            <div style={{display:"flex",gap:8,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
              <input type="text" placeholder="Frage stellen…" value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendChat()} style={{...iS,flex:1,fontSize:14}}/>
              <button onClick={sendChat} disabled={chatLoading||!chatInput.trim()} style={{background:chatInput.trim()&&!chatLoading?C.accent:C.border,color:"#fff",border:"none",borderRadius:10,padding:"0 18px",fontSize:18,cursor:chatInput.trim()?"pointer":"default"}}>↑</button>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
